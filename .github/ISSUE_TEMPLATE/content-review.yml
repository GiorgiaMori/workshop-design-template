name: Content review
description: Request a review of workshop materials before delivery.
title: "[Content review]: "
labels: ["content-review"]
body:
  - type: textarea
    id: overview
    attributes:
      label: What should be reviewed?
      description: Link the content and identify areas that need feedback.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Review checklist
      description: Include clarity, technical accuracy, timing, and accessibility.

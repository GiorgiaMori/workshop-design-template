name: Content review
description: Request a review of workshop materials before delivery.
title: "[Content review]: "
labels: ["content-review"]
body:
  - type: textarea
    id: overview
    attributes:
      label: What should be reviewed?
      description: Link the content and identify areas that need feedback.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Review checklist
      description: Review clarity, technical accuracy, timing realism, assessment evidence, and accessibility.

  - type: checkboxes
    id: dimensions
    attributes:
      label: Requested review dimensions
      options:
        - label: Learning outcomes are measurable
        - label: Exercises map to outcomes
        - label: Runsheet fits available time
        - label: Accessibility mitigations are concrete
        - label: Delivery checklist is complete
